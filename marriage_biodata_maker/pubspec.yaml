name: marriage_biodata_maker
description: A production-ready Marriage Biodata Maker Android app monetized with Google AdMob.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Utilities
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0

  # PDF Generation & Live Preview
  pdf: ^3.11.0
  printing: ^5.13.1

  # Media & File System
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # Monetization
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/borders/
    - assets/thumbnails/
